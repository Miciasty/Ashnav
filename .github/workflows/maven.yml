name: Java CI with Maven

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Checkout tested Ashcore sources
        uses: actions/checkout@v4
        with:
          repository: Miciasty/Ashcore
          ref: v1.2.0
          path: .verification/sources/Ashcore

      - name: Checkout tested Ashgrid sources
        uses: actions/checkout@v4
        with:
          repository: Miciasty/Ashgrid
          ref: v1.3.0
          path: .verification/sources/Ashgrid

      - name: Checkout tested Ashspace sources
        uses: actions/checkout@v4
        with:
          repository: Miciasty/Ashspace
          ref: v2.0.0
          path: .verification/sources/Ashspace

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify and install dependency libraries
        run: |
          for library in Ashcore Ashgrid Ashspace; do
            mvn -B -ntp clean install --file ".verification/sources/$library/pom.xml"
          done

      - name: Verify Ashnav and packaged artifacts
        run: mvn -B -ntp clean verify --file pom.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blackframe-verification-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .verification/sources/*/target/surefire-reports/**
            .verification/sources/*/target/failsafe-reports/**
            target/surefire-reports/**
            target/failsafe-reports/**

      - name: Identify verified artifacts
        id: artifact
        run: |
          version=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          name="ashnav-$version"
          test -f "target/$name.jar"
          test -f "target/$name-sources.jar"
          test -f "target/$name-javadoc.jar"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ashnav-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/${{ steps.artifact.outputs.name }}.jar
            target/${{ steps.artifact.outputs.name }}-sources.jar
            target/${{ steps.artifact.outputs.name }}-javadoc.jar
